[package]
name = "artcraft_native"
description = "ArtCraft desktop app in pure Rust: an egui UI over the ArtCraft API client (no Tauri, no webview)"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "artcraft_native"
path = "src/lib.rs"

[features]
default = ["upstream-branding"]
upstream-branding = ["dep:rodio", "eframe/glow"]

[[bin]]
name = "artcraft-native"
path = "src/main.rs"
required-features = ["upstream-branding"]

[dependencies]
# Internal (Tauri-free) API crates shared with the Tauri app.
artcraft_api_defs.workspace = true
artcraft_client.workspace = true
tokens.workspace = true

# External
anyhow.workspace = true
cookie.workspace = true
chrono.workspace = true
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence", "links"] }
egui = "0.37"
enums.workspace = true
# SVG creator icons are rasterized directly with resvg below; egui_extras/svg pins resvg 0.45.
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
env_logger.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
log.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
resvg = "0.47"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "fs"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
# Direct provider routing also pulls in wreq/BoringSSL through Kinovi and WorldLabs.
artcraft_router.workspace = true
cookie_store_wrapper.workspace = true
fal_client.workspace = true
midjourney_client.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wayland", "x11"] }
open = "5"
rfd = "0.16"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"], optional = true }

# Pasting images from the clipboard (egui's own clipboard support is text only).
arboard = { version = "3", default-features = false, features = ["image-data"] }

# The Midjourney sign-in window (its login cookies can only be captured inside a browser).
wry = "0.55"

[dev-dependencies]
egui_kittest = "0.37"
